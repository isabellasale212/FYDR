# Supabase CLI configuration for local development.
#
# The hosted project lives in the London region, which is irreversible and is recorded in
# 09-security-and-compliance.md §5. This file configures the LOCAL stack only.

project_id = "fydr"

[api]
enabled = true
port = 54321
# Only public is exposed through PostgREST. auth_hooks holds the access token hook and is
# reachable by supabase_auth_admin alone, never by an API caller. tests holds the pgTAP
# fixtures and must never be exposed at all.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Pinned to match the hosted project. Postgres 15 is what Phase 0 targets.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
# Applied by `supabase db reset` after every migration in supabase/migrations.
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
# 05-architecture.md §5. THIS LINE DOES NOT CONFIGURE PRODUCTION — like every other
# [auth] setting in this file, it applies to the local/CLI stack only, and the hosted
# project's value is a dashboard setting. On 2026-09-09 production was measured at 3600,
# twice this figure, because the 1800 had never been applied; it was set to 1800 that day.
# Check it against /auth/v1/settings or a live token's `exp - iat`, not against this file.
# The access token TTL is no longer the only thing bounding stale authority: base() in
# src/lib/session.ts compares the token's claims_version against the live column on every
# guarded request, so a revoked role stops working on the next one.
jwt_expiry = 1800
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false          # accounts are created by invite only, screens/onboarding.md
enable_anonymous_sign_ins = false
# 09-security-and-compliance.md §8 / screens/settings.md's own validation table.
# The app's forms already enforce this client-side (ChangePasswordForm.tsx,
# ResetConfirmForm.tsx) — this is the GoTrue-level backstop so a direct API
# call bypassing the UI still can't set anything shorter. Local/CLI-linked
# config only: the live hosted project's own Auth setting is managed via the
# Supabase dashboard and is not something this file can push on its own.
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
# 09-security-and-compliance.md §8.1
max_frequency = "1m"

[auth.email.template.invite]
subject = "You have been invited to Fydr"

[auth.sessions]
# A signed out session cannot be revived.
#
# THE EDGE FUNCTION THIS COMMENT USED TO CITE DOES NOT EXIST. It claimed "role removal
# forces sign out through the admin-set-role Edge Function" — there is no
# supabase/functions directory in this repo and never has been. Role removal is now
# enforced by the request-time claims_version comparison in base()
# (src/lib/session.ts), which signs the session out via /auth/stale-claims.
#
# inactivity_timeout is ALSO not in force on production: the dashboard field reads 0
# (never), session time-boxing reads never, and the whole User Sessions section is
# gated behind the Pro plan. Measured 2026-09-09.
inactivity_timeout = "72h"

# ---------------------------------------------------------------------------
# The custom access token hook.
#
# This is what puts org_id, athlete_id and roles into the JWT. Without it every helper in
# 0010 returns null, every policy predicate is false, and the application reads nothing at
# all. That is the correct failure mode, and it is also a confusing one, so if a freshly
# reset local stack shows empty screens this is the first setting to check.
#
# 05-architecture.md §5.
# ---------------------------------------------------------------------------
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/auth_hooks/custom_access_token_hook"

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
